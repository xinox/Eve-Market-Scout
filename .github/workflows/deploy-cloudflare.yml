name: Deploy Cloudflare

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require provisioned D1 binding
        run: |
          if ! grep -q '^database_id' packages/ingest-api/wrangler.toml; then
            echo 'Run the first interactive deployment locally and commit the generated database_id.'
            exit 1
          fi
      - run: npm run build:web
      - run: npm run db:migrate --workspace @eve-market-scout/ingest-api
      - run: npm run deploy --workspace @eve-market-scout/ingest-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
