name: Collect market data

on:
  schedule:
    # Every 30 minutes. GitHub schedules on public repos with no other repo
    # activity for 60 days get auto-disabled — see docs/ROADMAP.md for why
    # that's very unlikely to bite us, and what to do if it ever does.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # Runners are stateless — without this, per-rule cooldowns would reset
      # every single run and every triggered alert would re-fire on the next
      # poll (30min later) instead of respecting cooldownMinutes. Key is
      # unique per run so `cache/save` always succeeds; restore-keys falls
      # back to the most recent previous run's state.
      - name: Restore alert cooldown state
        uses: actions/cache/restore@v4
        with:
          path: data/alert-cooldowns.json
          key: alert-cooldowns-${{ github.run_id }}
          restore-keys: alert-cooldowns-

      - name: Run collector
        run: npm run collect
        env:
          # Flip to "http" once the ingest-api Worker is deployed (Phase 1.2).
          STORAGE_MODE: ${{ vars.STORAGE_MODE || 'json' }}
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_SECRET: ${{ secrets.INGEST_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ESI_USER_AGENT: ${{ vars.ESI_USER_AGENT }}

      # While STORAGE_MODE=json, upload the snapshot as a build artifact so
      # you can inspect a run's output without cloud storage at all.
      - name: Upload snapshot artifact (json mode only)
        if: ${{ vars.STORAGE_MODE != 'http' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14

      - name: Save alert cooldown state
        if: always() # save even if the collector step failed partway through
        uses: actions/cache/save@v4
        with:
          path: data/alert-cooldowns.json
          key: alert-cooldowns-${{ github.run_id }}
