name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck ingest-api (Cloudflare Worker, separate tsconfig)
        working-directory: packages/ingest-api
        run: npx tsc --noEmit
      - run: npm test
